# PROPOSED, DOCUMENTACAO: nenhum parser papacc.conf foi implementado.
# Ler grammar-proposed.md, directive-matrix.md e adr0009-reconciliation.md.
# Somente o cabecalho e as restricoes negativas abaixo estao descomentados.
# Nao e uma configuracao operacional qualificada. Nao executar/apply.
# Comentario e #; ponto-e-virgula NAO inicia comentario.
format_version 1
client_admission DISABLED
site_tls_admission DENY
ed11_admission DENY
network_egress DISABLED

# Preconditions do futuro apply: referencias reais obtidas da root, nunca criadas aqui.
# expected_root_ref "REF_ROOT_EXISTENTE"
# expected_current_revision 7

# CONCEITOS COM COMPONENTES EXISTENTES; SOURCE/PARSER AINDA PROPOSTOS.
# IDs abaixo sao rotulos ilustrativos; REF_* e PRINCIPAL_HEX16 exigem substituicao
# administrativa factual. Nao representam certificados, grants ou autoridade real.
# binding entrada
#   mode SELECTED
#   interface_ref "REF_PERSISTENTE_FATUAL"
# end
# Alternativa explicitamente mais ampla: mode ALL; nao e fallback de SELECTED.

# channel_tls canal
#   security_ref "REF_SEGURANCA_VERSIONADA"
# end
# Resolver exige identidade/leases/trust/PrincipalResolver/AuthZ factuais.
# Canal Secure atual: TLS1.3 + mTLS + ALPN papacc/1; nao configuravel para downgrade.

# access_auth acesso
#   method CERTIFICATE_IDENTITY
#   provider_ref "REF_AUTHN_AUTHZ_APROVADO"
# end
# OPEN nao exige login de aplicacao; CLOSED exige acesso autenticado.
# Nenhum dos dois elimina mTLS de SECURE_PRINCIPAL. Suporte end-to-end e gate.

# capability_policy capacidades
#   enable 2 1
#   enable 3 1
#   rule negar DENY 2 1 principal "PRINCIPAL_HEX16"
#   rule permitir ACCEPT 2 1 principal "OUTRO_PRINCIPAL_HEX16"
#   rule modo_c ACCEPT 3 1 principal "OUTRO_PRINCIPAL_HEX16"
# end
# Ordem textual explicita; ALL conditions; primeira terminal; no-match DENY.
# Exemplo ilustra regras, nao autoriza os Principals placeholders.

# listener frente
#   binding_ref entrada
#   port 7443
#   transport SECURE_PRINCIPAL
#   channel_tls_ref canal
#   admission CLOSED
#   authentication_ref acesso
#   policy_ref capacidades
# end
# Colecao: outro bloco listener com id unico e endpoints sem conflito.
# Target inicial que suporte apenas um deve rejeitar o segundo, nao ignora-lo.
# Legacy SOMENTE com transport LEGACY_ENDPOINT explicito em seu bloco e
# confirmacao administrativa do diff; nao herda perfil ausente. Egress v1 negado.

# destination_policy destinos
#   kind EXACT_ALLOWLIST
#   hostname "example.org" 443
#   endpoint "192.0.2.10" 443
# end
# Dados reservados para documentacao, nao destino autorizado. Nome E endpoint
# precisam ser permitidos apos resolucao unica; nao ha CIDR/suffix/range/DENY v1.

# egress_profile saida
#   profile_ref "REF_PROFILE_SERVER_OWNED"
#   destination_policy_ref destinos
# end
# Ref resolve interface/source/link/rota autorizados. Source atual so default-route;
# nao oferece DNS produtivo ou rotas arbitrarias. Entrada nao escolhe saida.

# outbound_tls remoto_b
#   profile_ref "REF_OUTBOUND_TLS_VERSIONADA"
# end
# Mode B: SYSTEM ou CUSTOM explicitos segundo ADR0027 e adapter qualificado;
# TLS1.3, hostname/SNI/ALPN, sem downgrade. Nao herda trust do canal ou SiteTLS.

# site_tls origem_c
#   catalog_ref "REF_CATALOGO_ADMIN_BODY05"
#   catalog_revision 4
#   profile_ref 1
#   profile_revision 2
# end
# Referencia aponta perfil completo committed, nao o recria. BODY0.5 inicial:
# SYSTEM, hostname/SNI, TLS1.3, ALPN aprovado (http/1.1 na campanha), validade UTC,
# revogacao e limites. IDs/revisoes acima apenas exemplos, nao epochs.
# Browser solicita ref; nao aprova trust. Mode C nao exige egress do Accelerator.

# provisioning clientes
#   issuer_ref emissor
#   manual REQUIRED
#   automatic REQUIRED
#   enrollment CLOSED
#   approval MANUAL_APPROVAL
#   authentication_ref "REF_AUTHN_ENROLLMENT"
# end
# GRUPO DE CONTRATO PENDENTE DE FRONTEND/ENFORCEMENT: nao ativar apenas por parse.
# AUTO_APPROVAL e OPEN sao alternativas governadas, nao bypass de verificacao.
# CLOSED enrollment exige password validado antes de qualquer approval.
# Automatico: chave local/CSR/PoP. Manual: custodia temporaria somente na excecao
# accepted. Pacote nao concede capabilities. Importacao granular e preservada.

# issuer emissor
#   authority_ref "REF_ISSUER_EXISTENTE_NA_ROOT"
# end
# Ref nao gera CA/chave/certificado. Serial, high-water, I/R/A/P, reservas,
# revogacao e estados sao fatos consultados, NUNCA campos editaveis deste arquivo.
# Recuperacao autoritativa segue DENY sem checkpoint recente/fencing comprovados.

# resources limites
#   profile_ref "REF_LIMITES_E_RESERVAS_GOVERNADOS"
#   evidence_ref "REF_EVIDENCIA_TARGET_APROVADA"
# end
# Reservas CONTROL/CANCEL/FINAL, coexistencia e retencao permanecem locais.
# Sem somar budget Browser+Accelerator; sem 512MiB/1000ms inventados.
# Freshness/headroom pendentes; provider/kernel UNKNOWN nao e aprovacao.

# audit administrativo
#   sink_ref "REF_LOGGER_DURAVEL_AUTORIZADO"
# end
# Registrar ator/operacao/revisao/regra/motivo quando o caminho suportar;
# trilha administrativa completa ainda pendente. Nunca tokens/chaves/passwords.

# FUTURO NAO EXECUTAVEL: IP/subnet/origem/interface como predicates, usuarios,
# grupos/nesting, dias/horarios/calendarios/DST, PUBLIC_INTERNET/CIDR/suffix,
# ranges, seletores automaticos, failover. Nenhuma sintaxe de diretiva e dada.
# Se aparecerem como diretivas ou condicoes ativas, rejeitar o candidate inteiro.
# Atualizacao: futuro CLI valida/diff/aplica transacionalmente; editar arquivo
# nao equivale a CURRENT. Stop, ED08, Model E, pins e retencao nao sao opcionais.
